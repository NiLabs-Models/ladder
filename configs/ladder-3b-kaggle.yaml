# Sized for ONE Kaggle GPU session (12h cap), with data prep done elsewhere.
#
# The length bound is the load-bearing number here. These are R1-style reasoning
# traces and they are long: median ~13,770 estimated tokens over the whole
# corpus, p90 ~23,400. Measured yield by bound:
#
#     max_tokens   5120 ->  1348 rows (17%)
#                  8192 ->  2412 rows (30%)
#                 16384 ->  4753 rows (58%)
#                 24576 ->  7635 rows (94%)
#
# 8192 is the most data that fits a 3B in 4-bit on a 16GB T4/P100 with room for
# activations. Keeping more would mean a context this hardware cannot hold, and
# traces past the bound are dropped rather than truncated -- a truncated trace
# teaches the model to stop mid-thought.
#
# An earlier version of this file used 5120, picked from a 25-row sample taken
# at offset 0. Those are easy early problems with a median near 2,700 tokens,
# and nothing about them generalizes to the corpus.

data:
  dataset: open-r1/codeforces-cots
  config_name: solutions_py_decontaminated
  split: train
  max_tokens: 8192
  min_tokens: 256
  require_finish_reason: stop
  dedup_by_problem: true
  val_fraction: 0.04
  seed: 17
  # 0 = use everything that survives the filters. A cap is pointless: the whole
  # corpus yields about 2.4k rows at this length bound, well under any cap worth
  # setting.
  max_samples: 0
  verify_solutions: true
  verify_max_tests: 4
  verify_timeout: 5.0
  verify_workers: 8

model:
  base_model: unsloth/Qwen2.5-Coder-3B-Instruct-bnb-4bit
  max_seq_length: 8192
  load_in_4bit: true
  lora_r: 32
  lora_alpha: 32
  lora_dropout: 0.0

train:
  output_dir: /kaggle/working/outputs/ladder-3b-kaggle
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 1.0
  max_steps: 150          # 150 * 16 = 2400 sequences, about one epoch
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  optim: adamw_8bit
  max_grad_norm: 0.5
  logging_steps: 5
  save_steps: 75
  save_total_limit: 2

eval:
  num_problems: 40
  samples_per_problem: 1
  # The tuned model is trained on long reasoning, so it generates long. Too low
  # a ceiling truncates it mid-thought and scores the fine-tune as producing no
  # code -- which would understate it against the base model, not overstate it.
  max_new_tokens: 4096
  temperature: 0.0        # greedy: this is a capability measurement
  timeout_seconds: 8.0
  max_tests_per_problem: 12
  results_path: /kaggle/working/outputs/eval/results.json
