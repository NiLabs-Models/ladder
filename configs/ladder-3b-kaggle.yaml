# Sized to finish inside ONE Kaggle kernel session (12h hard cap), including
# both evals. Budget: setup ~10m, data ~30m, base eval ~1.2h, train ~3.5h,
# tuned eval ~1.5h => ~7h with real margin.
#
# The margin is deliberate and this run is deliberately short. T4 training
# throughput for a 3B in 4-bit is the big unknown (800-1200 tok/s changes the
# total by hours), and a kernel killed at the cap loses the tuned eval -- the
# only number anyone actually wants. Run one buys a measured throughput figure;
# size run two off that.
#
# For a longer run once this one has landed, use configs/ladder-3b-t4.yaml.
name: ladder-3b-kaggle

data:
  dataset: open-r1/codeforces-cots
  config_name: solutions_py_decontaminated
  split: train
  max_tokens: 5120
  min_tokens: 256
  require_finish_reason: stop
  dedup_by_problem: true
  val_fraction: 0.04
  seed: 17
  # Cap the corpus so data prep is bounded. ~4.5k verified traces is enough to
  # move a 3B model on format and approach, which is what one epoch can do.
  max_samples: 4500
  verify_solutions: true
  verify_max_tests: 4
  verify_timeout: 5.0
  verify_workers: 8

model:
  base_model: unsloth/Qwen2.5-Coder-3B-Instruct-bnb-4bit
  max_seq_length: 6144
  load_in_4bit: true
  lora_r: 32
  lora_alpha: 32
  lora_dropout: 0.0

train:
  output_dir: /kaggle/working/outputs/ladder-3b-kaggle
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 1.0
  max_steps: 250          # 250 * 16 effective batch = 4000 sequences
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  optim: adamw_8bit
  max_grad_norm: 0.5
  logging_steps: 5
  save_steps: 75
  save_total_limit: 2

eval:
  num_problems: 60
  samples_per_problem: 1
  max_new_tokens: 3072
  temperature: 0.0        # greedy: this is a capability measurement
  timeout_seconds: 8.0
  max_tests_per_problem: 12
  results_path: /kaggle/working/outputs/eval/results.json
